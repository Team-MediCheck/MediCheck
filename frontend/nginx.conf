server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # HIRA·병원 동기화(admin): 처리가 수 시간 걸릴 수 있음. 일반 API 60s 제한보다 길게 둔다.
    location /api/hospitals/sync {
        proxy_pass http://backend:8080/api/hospitals/sync;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 앱 OAuth 브리지: `state` 가 `medichek_expo_webauth__`(이중 언더스코어, login.tsx 의 HTTPS+openBrowserAsync 경로)일 때
    # 정적 HTML이 `exp://` 또는 `medicheck://` 로 code 를 넘긴다. 이 패턴이 아니면 SPA(/oauth/kakao/callback)로 떨어진다.
    location = /oauth/kakao/callback {
        if ($arg_state ~ "^medichek_expo_webauth__") {
            rewrite ^ /expo-kakao-oauth.html last;
        }
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
