name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Backend tests
        working-directory: backend/server
        run: ./gradlew test --no-daemon

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Deployment shell syntax
        run: bash -n scripts/deploy/macmini.sh
      - name: Docker configuration regression tests
        run: python3 -B -m unittest discover -s scripts/deploy/tests -v
      - name: Frontend image permissions and startup
        run: |
          # Reproduce deployment extraction under umask 077.
          chmod 600 frontend/nginx.conf frontend/nginx.main.docker.conf
          docker build --build-arg VITE_KAKAO_APP_KEY=ci-placeholder -t medicheck-frontend:ci frontend
          docker run --rm --add-host backend:127.0.0.1 --entrypoint sh medicheck-frontend:ci -ec '
            nginx -t
            nginx
            trap "nginx -s quit" EXIT
            wget -q -O /dev/null http://127.0.0.1:8080/
          '
