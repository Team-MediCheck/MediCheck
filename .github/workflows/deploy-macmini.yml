name: Deploy Mac Mini

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "검증 후 실제 배포 (해제하면 환경 확인만 수행)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "backend/server/**"
      - "frontend/**"
      - "docker-compose.local.yml"
      - "scripts/deploy/macmini.sh"
      - ".github/workflows/deploy-macmini.yml"
      - ".github/workflows/ci-pr-smoke.yml"

permissions:
  contents: read

concurrency:
  group: deploy-macmini
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci-pr-smoke.yml

  deploy:
    needs: checks
    runs-on: [self-hosted, macOS, ARM64, medicheck]
    timeout-minutes: 60
    env:
      DEPLOY_PATH: ${{ vars.MACMINI_DEPLOY_PATH || '/Users/snowrabbit123/Desktop/Medicheck/MediCheck' }}
      VERIFY_ONLY: ${{ github.event_name == 'workflow_dispatch' && !inputs.deploy && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy checked out commit
        shell: bash
        run: |
          export PATH="/usr/local/bin:/opt/homebrew/bin:/Applications/Docker.app/Contents/Resources/bin:$PATH"
          bash scripts/deploy/macmini.sh
